<!doctype html>
<html lang="en" class="no-anim">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Update package — prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  /* iOS Safari enlarges text it judges too small to read, weighing each block of text's width
     against the viewport's. The screen here is laid out at its full size and scaled down to the
     frame, so its long lines (titles, descriptions) came out a size or two larger than the rest.
     The sizes set here are the design; leave them be. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* The "manager-5" Figma composition: the update-firmware dialog on desktop beside the same flow as
     a drawer on an iPhone 16 Pro, on no background (the carousel card shows around them). The old
     image covered 1042×918: Figma's 1029×918 plus the 13px the dialog's shadow reached to its left.
     The stage adds 40px either side of that, so the dialog's softer, wider shadow fades out before
     the frame edge instead of being cut by it. The dialog is drawn at Figma's 1.0646× of its 526×610
     base; the phone at 1:1. Heights follow what Figma rendered rather than its export, which adds
     borders Figma draws inside.
     Elevation uses the stacked shadows of shadow-plugin (shadow.floriankiem.com), the "-ring" kind
     whose last layer is the 1px hairline, so an edge and its shadow read as one.
     A scripted pointer plays it on a loop (the script): on the desktop dialog it reads down the
     packages, picks FW 3.6.0, the phone picking it too, and stops on applying it. */
  /* In dark, as the firmware prototype's screens are in this post: stone surfaces (#1c1917), the
     lifted fills a step lighter and the lists' wells a step darker, light text, and a light primary
     with dark text on it. */
  :root {
    --bg: #1c1917;
    --fg: #e7e5e4;
    --fg-light: #d6d3d1;
    --card-fg: #e7e5e4;
    --muted-fg: #a8a29e;
    --muted: #292524;
    --well: #141110;
    --border: #383431;
    --primary: #d6d3d1;
    --primary-fg: #1c1917;
    --ring: #78716c;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
    --sans: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0c0a09; overflow: hidden; }
  .embed, .embed body { background: transparent; }
  body { font-family: var(--sans); font-size: 14px; line-height: 20px; color: var(--fg); -webkit-font-smoothing: antialiased; }
  svg { display: block; }

  #stage { position: absolute; left: 50%; top: 50%; width: 1122px; height: 918px; margin: -459px 0 0 -561px; transform-origin: center;
           transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1); }

  /* The square phone card shows the desktop dialog alone (place). The 4:3 card (.compact, from the
     card's shape) draws the two screens 36px apart rather than 67, each moved in. */
  .square .phone { display: none; }
  .compact .dialog-wrap { left: 69px; }
  .compact .phone { left: 665px; }

  /* package cards, shared by both screens */
  .month { position: relative; height: 25.77px; }
  .dr-group + .dr-group .month { height: 26.63px; }
  .month span { position: absolute; left: 0; top: 6px; padding: 2px 24px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.06em; color: var(--muted-fg); opacity: 0.7; }
  /* the picked card lifts on a light scrim over its fill (white at 9%), and a hovered one on half
     that, so picking moves nothing */
  .pkg { display: flex; flex-direction: column; gap: 8px; padding: 18px 24px 16px; border-radius: 12px; background: var(--bg); transition: background-color 90ms ease; }
  .pkg.on { background: color-mix(in srgb, #fafaf9 9%, var(--bg)); }
  .pkg .info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .pkg .name { font-weight: 500; color: var(--fg-light); }
  .pkg .name, .pkg .note { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pkg .note { color: var(--muted-fg); }
  .sw { display: flex; align-items: center; gap: 8px; white-space: nowrap; opacity: 0.8; transition: opacity 90ms ease; }
  .pkg.on .sw { opacity: 1; }
  /* Figma's text boxes run a little past the glyphs (the mono ones ~1px), so the badges, the dot and
     the "@" keep that room and everything after them lands where Figma has it. Both badges are the
     secondary kind: a muted fill, no stroke. */
  .badge { display: inline-flex; align-items: center; padding: 1px 4px; min-width: 18px; border-radius: 4px; font-family: var(--mono); font-size: 12px; line-height: 16px; background: var(--muted); color: var(--primary); }
  .badge.hmi { padding-right: 4.91px; }
  .badge.mcu { padding-right: 6px; }
  .dot { width: 4px; color: var(--ring); }
  .fw { display: flex; align-items: center; gap: 2px; color: var(--muted-fg); }
  .fw .ver { display: flex; align-items: center; gap: 2.4px; }
  .fw .ver.mono { gap: 4.91px; font-family: var(--mono); font-size: 12px; line-height: 16px; }
  .fw .at { opacity: 0.5; font-family: var(--sans); }
  .scroll { overflow-y: auto; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  /* desktop dialog */
  .dialog-wrap { position: absolute; left: 53px; top: 46px; width: 560px; height: 649.43px; }
  .dialog { position: absolute; left: 0; top: 0; width: 526px; height: 610px; transform: scale(1.0646); transform-origin: 0 0; display: flex; flex-direction: column; overflow: hidden;
            background: var(--bg); border-radius: 8px;
            /* smooth-shadow-ring-lg's shadow, without its hairline: the dark dialog needs no edge */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05), 0 12px 24px rgba(0, 0, 0, 0.04), 0 6px 12px rgba(0, 0, 0, 0.03),
                        0 3px 6px rgba(0, 0, 0, 0.02), 0 1.5px 3px rgba(0, 0, 0, 0.02); }
  /* Figma rounds the dialog's line heights to whole pixels at its 1.0646× size */
  .dialog .pkg { line-height: 20.66px; }
  .dialog .badge, .dialog .fw .ver.mono, .dialog .month span { line-height: 16.9px; }
  .dialog .badge.mcu { padding-right: 5.6px; }
  .dialog .badge.hmi { padding-right: 4px; }
  .dialog .dot { width: auto; }
  .dialog .fw .ver.mono { gap: 5.57px; }
  .d-head { height: 61.85px; flex-shrink: 0; padding: 24px 8px 0 24px; }
  /* quieter than Figma's 18px semibold: the 16px medium the phone sheet's title uses, a pixel lower
     so its centre stays level with the close button */
  .d-title { padding-top: 1px; font-size: 16px; line-height: 1; font-weight: 500; color: var(--card-fg); }
  .d-close { position: absolute; top: 13px; right: 13.1px; padding: 12px; border-radius: 8px; color: var(--primary); transition: background-color 90ms ease; }
  /* the drawer's full-width stone hairline, the picked tab's underline drawn over it */
  .d-tabs { height: 40px; flex-shrink: 0; display: flex; gap: 6px; padding: 0 0 4px 14px; box-shadow: inset 0 -1px 0 var(--border); }
  .d-tab { height: 36px; padding: 8px 10px 0; border-radius: 6px; transition: background-color 90ms ease; }
  .d-tab span { display: block; padding-bottom: 12px; color: var(--muted-fg); }
  .d-tab.on span { color: var(--fg); box-shadow: inset 0 -2px 0 var(--primary); }
  .d-body { flex: 1; min-height: 0; background: var(--well); padding: 28px 40px; }
  .d-list { display: flex; flex-direction: column; gap: 72px; padding: 40px 0; }
  .d-group { position: relative; display: flex; flex-direction: column; gap: 12px; }
  .d-group .month { position: absolute; left: 13px; top: -38px; height: auto; padding: 6px 0; background: var(--well); }
  .d-group + .d-group .month { top: -36px; }
  .d-group .month span { position: static; display: block; padding: 2px 10px; }
  .d-foot { height: 64.4px; flex-shrink: 0; display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; padding: 11px 24px 0; background: var(--bg); }
  /* Cancel keeps the slate of the stock button it came from, as Figma has it */
  .btn { display: flex; align-items: center; justify-content: center; min-width: 64px; padding: 5px 11px; border-radius: 6px; border: 1px solid #44403c; font-weight: 500; line-height: 24px; color: var(--fg); background: var(--bg); transition: background-color 90ms ease, opacity 90ms ease, filter 90ms ease; }
  .btn.primary { border-color: var(--primary); background: var(--primary); color: var(--primary-fg); }
  .d-foot .btn { line-height: 24.42px; }

  /* phone drawer */
  .phone { position: absolute; left: 680px; top: 0; width: 402px; height: 918px; overflow: hidden; background: var(--bg); border: 1px solid rgba(255, 255, 255, 0.08); }
  .ph-screen { position: absolute; left: -1px; top: -1px; width: 402px; height: 874px; overflow: hidden; background: rgba(12, 10, 9, 0.85); }
  .ph-status { position: absolute; left: 0; top: 0; width: 402px; display: flex; align-items: center; gap: 6px; padding: 11px 16px; }
  .ph-status .time { flex: 1; text-align: center; padding-top: 2px; font-family: "SF Pro Text", -apple-system, system-ui, sans-serif; font-size: 17px; line-height: 22px; font-weight: 600; color: #fff; }
  .ph-status .island { width: 125px; height: 37px; }
  .ph-status .levels { flex: 1; display: flex; justify-content: center; align-items: center; gap: 7px; padding-top: 1px; }
  .drawer { position: absolute; left: 0; top: 62px; width: 402px; height: 812px; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); border-radius: 12px 12px 0 0;
            /* smooth-shadow-ring-lg with the plugin's own 5% hairline */
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05), 0 12px 24px rgba(0, 0, 0, 0.04), 0 6px 12px rgba(0, 0, 0, 0.03),
                        0 3px 6px rgba(0, 0, 0, 0.02), 0 1.5px 3px rgba(0, 0, 0, 0.02), 0 0 0 1px rgba(255, 255, 255, 0.06); }
  /* the iOS sheet grabber's 36×5, in the same 24px row Figma's 100×8 handle took */
  .dr-handle { height: 24px; padding-top: 8px; display: flex; justify-content: center; flex-shrink: 0; }
  .dr-handle span { width: 36px; height: 5px; border-radius: 999px; background: #57534e; }
  .dr-head { position: relative; padding: 16px; flex-shrink: 0; text-align: center; font-size: 16px; line-height: 24px; font-weight: 500; color: var(--card-fg); }
  .dr-back { position: absolute; left: 16.15px; top: 12px; padding: 8px; border-radius: 6px; color: var(--primary); transition: background-color 90ms ease; }
  .dr-tabs { display: flex; flex-shrink: 0; box-shadow: inset 0 -1px 0 var(--border); }
  .dr-tab { flex: 1; padding: 8px 16px 14px; text-align: center; font-size: 16px; line-height: 24px; font-weight: 500; color: var(--muted-fg); transition: background-color 90ms ease; }
  .dr-tab.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--primary); }
  .dr-body { flex: 1; min-height: 0; background: var(--well); padding: 28px 16px; }
  .dr-list { display: flex; flex-direction: column; gap: 40px; }
  .dr-group { display: flex; flex-direction: column; gap: 12px; }
  .dr-group + .dr-group { gap: 10px; }
  /* the drawer runs past the screen: only the top of its footer shows above the home indicator */
  .dr-foot { flex-shrink: 0; height: 80px; margin-bottom: -48px; padding: 7px 16px 32px; background: var(--muted); border-top: 1px solid var(--border); }
  .dr-foot .btn { width: 100%; height: 40px; font-size: 16px; }
  .ph-home { position: absolute; left: 50%; bottom: 7px; width: 144px; height: 5px; margin-left: -72px; border-radius: 100px; background: #fff; }

  /* what the scripted pointer is over, as a real one shows it (below) */
  .pkg.hover:not(.on) { background: color-mix(in srgb, #fafaf9 4.5%, var(--bg)); }
  .btn.primary.hover { opacity: 0.9; }

  /* ---------- the pointer ----------
     macOS-size pointers against the 1:1 screen, as in the other prototypes: Figma's "Cursor / Hand"
     and an arrow to match, each offset so its hotspot sits on the point, presses scaling about it.
     A real pointer (the lightbox's copy) puts it out of sight, so there's only one. */
  .cursor { position: absolute; z-index: 25; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0;
            transition: transform 520ms cubic-bezier(0.4, 0, 0.2, 1), opacity 200ms ease; }
  .cursor.on { opacity: 1; }
  .cursor svg { position: absolute; overflow: visible; filter: drop-shadow(-0.67px 0.67px 0.93px rgba(0, 0, 0, 0.6)); }
  .cursor .c-arrow { left: -5px; top: -2.5px; transform-origin: 5px 2.5px; }
  .cursor .c-hand { display: none; left: -9.45px; top: -1.6px; transform-origin: 9.45px 1.6px; }
  .cursor.hand .c-arrow { display: none; }
  .cursor.hand .c-hand { display: block; }
  .cursor.down svg { transform: scale(0.9); }
  .live .cursor.on { opacity: 0; }

  /* ---------- real pointer input ----------
     In the lightbox the page takes real hover and clicks (on the carousel card it's inert): a click
     picks a package on both screens at once and each list scrolls; buttons show hover and press, and
     the tabs, which go nowhere, only press. Text doesn't select. */
  html { -webkit-user-select: none; user-select: none; cursor: default; }
  /* Hover only where a pointer can hover: on a touch screen a tap would leave it stuck on. */
  @media (hover: hover) and (pointer: fine) {
    /* a card under the pointer takes half the picked card's scrim */
    .pkg:not(.on):hover { background: color-mix(in srgb, #fafaf9 4.5%, var(--bg)); }
    .d-close:hover, .dr-back:hover { background: rgba(68, 64, 60, 0.6); }
    .btn:not(.primary):hover { background: var(--muted); }
    .btn.primary:hover { opacity: 0.9; }
  }
  .pkg:active, .btn:active, .d-close:active, .dr-back:active, .d-tab:active, .dr-tab:active { filter: brightness(0.96); }
  .no-anim, .no-anim * { transition: none !important; }
</style>
</head>

<script>
const $ = id => document.getElementById(id);
/* Packages by month: [name, note, MCU firmware, config version, firmware set in mono]. The two July
   packages show their firmware in mono and the June ones in the sans, as Figma has them. */
const MONTHS = [
  ['JUL 2025', [
    ['FW 3.6.0', 'Supports new firmware build workflow and minor bug fix', 'v1.1g', '3.6.0', true],
    ['FW 3.5.12', 'Minor recipe temperature control improvements', 'v1.1g', '3.5.12', true],
  ]],
  ['JUN 2025', [
    ['App 3.5.8 / FW 3.5.11', 'Improved support for OQC process', 'v1.1g', '3.5.11', false],
    ['App 3.5.7 / FW 3.5.10', 'Improved support for OQC process', 'v1.1g', '3.5.11', false],
  ]],
];
const card = ([name, note, fw, cfg, mono]) => `
  <div class="pkg">
    <div class="info">
      <div class="name">${name}</div>
      <div class="note">${note}</div>
    </div>
    <div class="sw"><span class="badge hmi">3.5.8</span><span class="dot">·</span><span class="fw"><span class="ver${mono ? ' mono' : ''}">${fw}<span class="at">@</span></span><span class="badge mcu">${cfg}</span></span></div>
  </div>`;
$('deskList').innerHTML = MONTHS.map(([m, pkgs]) => `<div class="d-group"><div class="month"><span>${m}</span></div>${pkgs.map(card).join('')}</div>`).join('');
$('phoneList').innerHTML = MONTHS.map(([m, pkgs]) => `<div class="dr-group"><div class="month"><span>${m}</span></div>${pkgs.map(card).join('')}</div>`).join('');

// It's one dialog shown on two screens, so a package picked on either is picked on both.
const lists = [$('deskList'), $('phoneList')].map(list => [...list.querySelectorAll('.pkg')]);
const pick = i => lists.forEach(pkgs => pkgs.forEach((p, j) => p.classList.toggle('on', j === i)));
lists.forEach(pkgs => pkgs.forEach((p, i) => p.addEventListener('click', () => pick(i))));
const desk = lists[0], deskBody = document.querySelector('.d-body');
const hoverPkg = i => desk.forEach((p, j) => p.classList.toggle('hover', j === i));

/* ---------- the loop ----------
   As in the other prototypes, waits are scheduled against the wall clock rather than chained
   timeouts: step n of the loop lands at loopStart + (sum of waits up to n), and an embedded copy
   takes loopStart from Date.now() too, so the carousel card and its lightbox copy show the same
   moment. A wait whose time has passed returns at once, which is how a copy that starts mid-loop
   catches up; the first that hasn't is the first moment the scene is in place. */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let runId = 0, loopStart = 0, vt = 0, dry = false, caughtUp = false;
async function wait(ms, id) {
  if (id !== runId) throw 'abort';
  vt += ms;
  if (dry) return;
  while (true) {
    if (id !== runId) throw 'abort';
    const left = loopStart + vt - Date.now();
    if (left <= 0) return;
    if (!caughtUp) markCaughtUp();
    await sleep(Math.min(left, 30));
  }
}
async function loop() {
  const id = ++runId;
  try {
    // Measure the loop with a dry run (every wait returns at once), so a synced copy can find its place in it.
    dry = true; vt = 0; await play(id); dry = false;
    const length = vt;
    while (true) {
      const now = Date.now();
      loopStart = root.classList.contains('embed') ? now - (now % length) : now;
      vt = 0;
      await play(id);
    }
  } catch (e) { dry = false; if (e !== 'abort') throw e; }
}

/* ---------- the pointer ----------
   Points are stage px, measured off the elements they're over. */
const cursor = $('cursor');
function stageBox(el) {
  const st = $('stage'), s = st.getBoundingClientRect(), b = el.getBoundingClientRect();
  const k = s.width / st.offsetWidth;
  return { left: (b.left - s.left) / k, top: (b.top - s.top) / k, right: (b.right - s.left) / k, bottom: (b.bottom - s.top) / k,
           cx: ((b.left + b.right) / 2 - s.left) / k, cy: ((b.top + b.bottom) / 2 - s.top) / k };
}
function jump(x, y) {
  cursor.style.transition = 'none'; cursor.classList.remove('hand');
  cursor.style.transform = `translate(${x}px, ${y}px)`;
  cursor.offsetHeight; cursor.style.transition = ''; cursor.classList.add('on');
}
async function moveTo(x, y, id, ms = 560, hand = false) {
  if (!hand) cursor.classList.remove('hand');
  cursor.style.transitionDuration = `${ms}ms, 200ms`;
  cursor.style.transform = `translate(${x}px, ${y}px)`;
  await wait(ms, id);
  cursor.classList.toggle('hand', hand);
}
async function click(id) {
  cursor.classList.add('down'); await wait(130, id); cursor.classList.remove('down');
}
// Over a desktop package, a little in from its left, lit once the pointer's most of the way there.
async function toPkg(i, id, ms, x = 0.42) {
  const b = stageBox(desk[i]);
  cursor.style.transitionDuration = `${ms}ms, 200ms`;
  cursor.style.transform = `translate(${b.left + (b.right - b.left) * x}px, ${b.top + 30}px)`;
  await wait(ms * 0.6, id);
  hoverPkg(i); cursor.classList.add('hand');
  await wait(ms * 0.4, id);
}
// The desktop list scrolled by the wheel under the pointer, at once while catching up.
const scrollDesk = top => deskBody.scrollTo({ top, behavior: caughtUp && !dry ? 'smooth' : 'auto' });

async function play(id) {
  // FW 3.5.12, the package the robots are on, picked to begin with
  pick(1); hoverPkg(-1); $('apply').classList.remove('hover'); deskBody.scrollTop = 0;
  // From the dialog's empty tab bar, right of its tabs
  const tabs = stageBox(document.querySelector('.d-tabs'));
  const rest = [tabs.right - 90, tabs.cy + 6];
  jump(...rest);
  await wait(900, id);

  // reading down the packages, on to June's and back up
  await toPkg(1, id, 680);
  await wait(500, id);
  await toPkg(2, id, 360);
  await wait(360, id);
  scrollDesk(deskBody.scrollHeight - deskBody.clientHeight);
  hoverPkg(-1);
  await wait(500, id);
  await toPkg(3, id, 320);
  await wait(600, id);
  hoverPkg(-1);
  scrollDesk(0);
  await wait(500, id);

  // FW 3.6.0, picked on both screens at once
  await toPkg(0, id, 520);
  await wait(380, id);
  await click(id);
  pick(0);
  await wait(900, id);

  // on to applying it, stopping short of the click
  await moveTo(...(b => [b.cx + 6, b.cy + 2])(stageBox($('apply'))), id, 760, true);
  hoverPkg(-1);
  $('apply').classList.add('hover');
  await wait(1600, id);

  // and away, back to the robots' package for the next
  $('apply').classList.remove('hover');
  await moveTo(...rest, id, 800);
  pick(1);
  await wait(1000, id);
}

/* ---------- embedding ----------
   Same handshake as the other prototypes: once the fonts are in, the loop starts, and once it has
   caught up and that frame has painted, transitions come back and an embedding page is told this one
   is ready to show (and told again if it asks with "proto:ping", in case it only started listening
   after the page had loaded). */
const SCENE = 'package';
const root = document.documentElement;
if (new URLSearchParams(location.search).has('embed')) root.classList.add('embed');
let shown = false;
const announce = () => { if (parent !== window) parent.postMessage({ type: 'proto:ready', scene: SCENE }, location.origin); };
addEventListener('message', e => { if (e.origin === location.origin && e.data === 'proto:ping' && shown) announce(); });
function markCaughtUp() {
  caughtUp = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.classList.remove('no-anim');
    shown = true;
    announce();
  }));
}
addEventListener('pointermove', e => { if (e.pointerType !== 'touch') root.classList.add('live'); }, { passive: true });
root.addEventListener('pointerleave', () => root.classList.remove('live'));
document.fonts.ready.then(loop);

/* ---------- framing ----------
   The stage scales to fit the frame. On the square phone card the frame is the whole card instead
   (update-package-demo.tsx), where the two screens side by side come out too small: the phone goes,
   and the dialog is centred in the card with a margin of 40 stage px above and below. */
const BASE_VIEW = () => { const w = 649.43 + 80; return { x: 53 + 280 - w / 2, y: 46 + 649.43 / 2 - w / 2, w, h: w }; };
let view = null;
const isSquare = () => innerWidth < (innerHeight * 7) / 6;
// The card the page is framed into (live-prototype.tsx), whose shape says which layout: 4:3 is
// .compact. The lightbox's copy is 16:9.
const host = frameElement?.closest('[data-live-prototype]');
function place() {
  const st = $('stage'), W = st.offsetWidth, H = st.offsetHeight;
  const square = isSquare();
  root.classList.toggle('square', square);
  root.classList.toggle('compact', !square && !!host && host.clientWidth < host.clientHeight * 1.55);
  const v = square ? view ?? BASE_VIEW() : null;
  const k = v ? Math.min(innerWidth / v.w, innerHeight / v.h) : Math.min(innerWidth / W, innerHeight / H);
  const [tx, ty] = v ? [-k * (v.x + v.w / 2 - W / 2), -k * (v.y + v.h / 2 - H / 2)] : [0, 0];
  st.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
  return k;
}
const aim = v => { view = v; place(); };
// A resize lands at once rather than gliding there.
function fit() {
  const st = $('stage');
  st.style.transition = 'none'; place(); st.offsetHeight; st.style.transition = '';
}
addEventListener('resize', fit); fit();
addEventListener('keydown', e => {
  if (!root.classList.contains('embed')) return;
  // A click into the lightbox's live copy moves keyboard focus into this page, so hand the
  // lightbox's own keys back to it.
  if (e.key === 'Escape' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    parent.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, code: e.code, bubbles: true, cancelable: true }));
  }
});
</script>
</body>
</html>
