<!doctype html>
<html lang="en" class="no-anim">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Update history — prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  /* iOS Safari enlarges text it judges too small to read, weighing each block of text's width
     against the viewport's. The screen here is laid out at its full size and scaled down to the
     frame, so its long lines (titles, descriptions) came out a size or two larger than the rest.
     The sizes set here are the design; leave them be. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* The "manager-6" Figma frame: the release center's update history, service groups down the side
     and one column per released firmware, scrolled to the latest two. Figma draws it at 0.8749×
     (1055×659 with a 1px outline around it, the 1057×661 the old image covered); this page is built
     at the base size it stands for (14px body text, 40px rows) and the stage scales to fit. A scripted
     pointer plays it on a loop (the script): onto a group, along its row from the oldest release to
     the newest, then down the newest's configs, each telling its release in a popover as it's
     hovered. */
  /* In dark, as the firmware prototype's screens are in this post: stone surfaces (#1c1917), the
     sidebar on the same with only its rule to set it off (light mode tints it), the lifted fills a
     step lighter, light text, and a light primary with dark text on it. */
  :root {
    --bg: #1c1917;
    --fg: #d6d3d1;
    --muted-fg: #a8a29e;
    --border: #383431;
    --soft-border: rgba(68, 64, 60, 0.5);
    --secondary: #292524;
    --primary: #d6d3d1;
    --primary-fg: #1c1917;
    --tint: rgba(41, 37, 36, 0.4);
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
    --sans: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0c0a09; overflow: hidden; }
  /* Embedded, the outline around the frame sits on the carousel card itself. */
  .embed, .embed body { background: transparent; }
  /* On the square card (place) the screen is laid out 880px across, a release column at a time. */
  .square #stage { width: 880px; margin-left: -440px; }
  .square .frame { width: 877.71px; }
  /* On the 4:3 card (.compact, from the card's shape in the script) the release columns come in to
     360px and the screen to 940px across, so it can show from its top-left corner and still have the
     newest release in view once scrolled to it. */
  .compact #stage { width: 940px; margin-left: -470px; }
  .compact .frame { width: 937.71px; }
  .compact .plan { width: 360px; }
  body { font-family: var(--sans); font-size: 14px; line-height: 20px; color: var(--fg); -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .ic { width: 16px; height: 16px; flex-shrink: 0; }

  #stage { position: absolute; left: 50%; top: 50%; width: 1208.2px; height: 755.55px; margin: -377.78px 0 0 -604.1px; transform-origin: center;
           transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1); }
  /* Figma's 1px outline (1.143px at this size) sits outside the frame */
  .frame { position: absolute; left: 1.143px; top: 1.143px; width: 1205.91px; height: 753.27px; display: flex; overflow: hidden; background: var(--bg);
           box-shadow: 0 0 0 1.143px rgba(255, 255, 255, 0.06); }

  /* sidebar */
  .sidebar { width: 48px; flex-shrink: 0; background: var(--bg); border-right: 1px solid var(--soft-border); display: flex; flex-direction: column; }
  .sb-head { padding: 14px 8px 36px; }
  .sb-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .sb-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: var(--muted-fg); transition: background-color 90ms ease; }
  .sb-btn.on { background: var(--border); color: var(--fg); }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topnav { height: 48px; flex-shrink: 0; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; }
  .btns { display: flex; gap: 8px; }
  .btn { height: 32.57px; min-width: 64px; padding: 0 12px; display: flex; align-items: center; gap: 4px; border-radius: 6px; font-weight: 500; transition: background-color 90ms ease, opacity 90ms ease, filter 90ms ease; }
  .btn.outline { border: 1px solid var(--border); padding: 0 11px; background: var(--bg); color: var(--primary); }
  .btn.solid { gap: 0; padding: 0 8px; background: var(--primary); color: var(--primary-fg); }

  /* ---------- history table ----------
     Every row is 40px with its rules drawn inside it, as Figma does: a full rule under the header,
     soft ones between the groups and a full one under the last. The group column stays put while
     the firmware columns scroll beneath its edge shadow; a white fade covers the right edge. Each
     one's opacity follows the scroll (--start, --end; see edges()) rather than snapping. */
  .table { position: relative; flex: 1; min-height: 0; display: flex; }
  .sg { position: relative; z-index: 2; width: 216px; flex-shrink: 0; background: var(--bg); border-right: 1px solid var(--soft-border); }
  .sg::after { content: ""; position: absolute; top: 0; bottom: 0; left: 100%; width: 17px; pointer-events: none;
               background: linear-gradient(to right, rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.14) 30%, rgba(0, 0, 0, 0.05) 65%, transparent);
               opacity: var(--start, 0); }
  .hd, .r, .cell { height: 40px; display: flex; align-items: center; padding: 0 32px; box-shadow: inset 0 -1px 0 var(--soft-border); transition: background-color 60ms ease; }
  .hd { background: var(--tint); box-shadow: inset 0 1px 0 var(--border), inset 0 -1px 0 var(--border); }
  .last { box-shadow: inset 0 -1px 0 var(--border); }
  .r { color: var(--muted-fg); white-space: nowrap; }
  .r .indent { padding-right: 8px; font-weight: 500; opacity: 0.3; }

  .plans { flex: 1; min-width: 0; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .plans::-webkit-scrollbar { display: none; }
  /* A trackpad pulling the releases past either end (the rubber band) opens a gap beside them, by the
     group column or after the last release, that was bare white with the rows broken off at it. The
     scroller paints the rows itself, the header's tint and rules and a rule under each group, and
     it stays put while its content moves, so the rows run on through the gap. The track is opaque
     over it, so nothing is drawn twice where the cells are. --rows is set from GROUPS. */
  .plans { background:
    linear-gradient(var(--border), var(--border)) 0 0 / 100% 1px no-repeat,
    linear-gradient(var(--border), var(--border)) 0 39px / 100% 1px no-repeat,
    linear-gradient(var(--tint), var(--tint)) 0 0 / 100% 40px no-repeat,
    repeating-linear-gradient(to bottom, transparent 0 39px, var(--soft-border) 39px 40px) 0 40px / 100% calc((var(--rows) - 1) * 40px) no-repeat,
    linear-gradient(var(--border), var(--border)) 0 calc(var(--rows) * 40px + 39px) / 100% 1px no-repeat,
    var(--bg); }
  .track { display: flex; width: max-content; height: 100%; background: var(--bg); }
  .plan { width: 480px; flex-shrink: 0; }
  .plan .hd { gap: 24px; padding-right: 0; }
  .plan .hd .t { flex: 1; min-width: 0; font-weight: 500; line-height: 24px; color: var(--muted-fg); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  /* the arrow to the next release straddles the column edge (Figma pads it -8px past the column) */
  .plan .hd .ic { margin-right: -8px; color: var(--muted-fg); opacity: 0.4; }
  .cell { gap: 12px; white-space: nowrap; }
  /* both badges are the secondary kind: a muted fill, no stroke */
  .badge { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; padding: 1px 4.3px; border-radius: 4px; font-family: var(--mono); font-size: 12px; line-height: 16px; background: var(--secondary); color: var(--primary); }
  .badge.mcu { padding: 1px 3.3px; }
  /* Figma's separator is a zero-width box whose stroke falls just left of it */
  .sep { width: 1px; height: 12px; margin-left: -1px; background: var(--soft-border); }
  .fw { display: flex; align-items: center; gap: 2px; color: var(--muted-fg); }
  /* Figma's text boxes run a hair past the glyphs, which sets where the "@" and the MCU badge land */
  .fw .ver { padding-right: 0.4px; }
  .fw .at { padding-right: 0.5px; opacity: 0.5; }
  .fade { position: absolute; z-index: 3; top: 0; right: 0; bottom: 0; width: 150.88px; pointer-events: none;
          background: linear-gradient(to right, rgba(28, 25, 23, 0), rgba(28, 25, 23, 0.7)); opacity: var(--end, 1); }

  /* hovering a cell lights its row across the table and its release down the column, the cell
     where they cross a step darker, as Figma's hover frame shows */
  .hr { background: var(--tint); }
  .plan.hc .hd { background: rgba(41, 37, 36, 0.8); }
  .plan.hc .cell { background: var(--tint); }
  .plan.hc .cell.hr { background: var(--secondary); }
  .ver.u { text-decoration-line: underline; }

  /* A config's release, in a popover over it as a chart shows a point's values, dark like the
     version picker on the release screen: the parameter set it was built from, then, fainter, when
     and by whom it was released. It slides from one config to the next rather than closing between
     them. */
  .tip { position: absolute; z-index: 20; left: 0; top: 0; padding: 7px 10px; border-radius: 6px; background: #1c1917; color: #fafaf9;
         border: 1px solid #44403c; font-size: 12px; line-height: 18px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3); pointer-events: none;
         opacity: 0; transform: translate(var(--x), calc(var(--y) + 4px));
         transition: opacity 150ms ease, transform 320ms cubic-bezier(0.3, 0.7, 0.3, 1); }
  .tip.on { opacity: 1; transform: translate(var(--x), var(--y)); }
  .tip .cfg { font-family: var(--mono); font-size: 11.5px; color: #fafaf9; }
  .tip .when { color: #a8a29e; }

  /* ---------- the pointer ----------
     macOS-size pointers against the 1:1 screen, as in the other prototypes: Figma's "Cursor / Hand"
     and an arrow to match, each offset so its hotspot sits on the point. A real pointer (the
     lightbox's copy) puts it and its popover out of sight, so there's only one. */
  .cursor { position: absolute; z-index: 25; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0;
            transition: transform 520ms cubic-bezier(0.4, 0, 0.2, 1), opacity 200ms ease; }
  .cursor.on { opacity: 1; }
  .cursor svg { position: absolute; overflow: visible; filter: drop-shadow(-0.67px 0.67px 0.93px rgba(0, 0, 0, 0.6)); }
  .cursor .c-arrow { left: -5px; top: -2.5px; }
  .cursor .c-hand { display: none; left: -9.45px; top: -1.6px; }
  .cursor.hand .c-arrow { display: none; }
  .cursor.hand .c-hand { display: block; }
  .live .cursor.on, .live .tip.on { opacity: 0; }

  /* ---------- real pointer input ----------
     In the lightbox the page takes real hover and clicks (on the carousel card it's inert): the
     table lights the hovered row and release, a firmware name underlines like the link it is, the
     releases scroll sideways (a vertical wheel scrolls them too), and the buttons show hover and
     press, the loop holding off while the pointer's there. Text doesn't select. */
  html { -webkit-user-select: none; user-select: none; cursor: default; }
  .ver { cursor: pointer; text-underline-offset: 1.5px; text-decoration-thickness: 1px; }
  .ver:active { opacity: 0.7; }
  /* Hover only where a pointer can hover: on a touch screen a tap would leave it stuck on. */
  @media (hover: hover) and (pointer: fine) {
    .ver:hover { text-decoration-line: underline; }
    .sb-btn:not(.on):hover { background: var(--border); }
    .btn.outline:hover { background: var(--secondary); }
    .btn.solid:hover { opacity: 0.9; }
  }
  .sb-btn:active, .btn:active { filter: brightness(0.92); }
  .no-anim, .no-anim * { transition: none !important; }
</style>
</head>
<body>
<div id="stage">
  <div class="frame">
    <aside class="sidebar">
      <div class="sb-head"><div class="sb-btn"><svg class="ic" viewBox="0 0 21.3333 21.3333"><path d="M10.6664 1.77561C15.096 1.77561 18.6613 5.30172 18.6674 9.62326V19.5578H17.4047V10.5207H17.4057V9.63401C17.4054 5.95134 14.3741 2.99045 10.6664 2.99045C6.95882 2.99047 3.92843 5.95097 3.92817 9.63401V9.63498C3.92858 13.3178 6.9586 16.2795 10.6664 16.2795H11.8745L12.2651 17.4934H10.6664C8.64409 17.4934 6.80249 16.7541 5.39399 15.5393L3.92817 14.2746V19.5578H2.6645V9.63401C2.66476 5.30753 6.23327 1.77563 10.6664 1.77561Z" stroke="#A8A29E" stroke-width="1.77333" fill="none"/></svg></div></div>
      <div class="sb-list">
        <div class="sb-btn"><i data-icon="house"></i></div>
        <div class="sb-btn on"><i data-icon="chevrons-left-right-ellipsis"></i></div>
        <div class="sb-btn"><i data-icon="flask-conical"></i></div>
      </div>
    </aside>
    <div class="content">
      <div class="topnav">
        <span>Release center</span>
        <div class="btns"><div class="btn outline">Field config</div><div class="btn solid"><i data-icon="plus"></i><span style="padding: 0 4px">New release</span></div></div>
      </div>
      <div class="table" id="table">
        <div class="sg" id="sg"></div>
        <div class="plans" id="plans"><div class="track" id="track"></div></div>
        <div class="fade"></div>
      </div>
    </div>
  </div>
  <div class="tip" id="tip"><div class="cfg" id="tipCfg"></div><div class="when" id="tipWhen"></div></div>
  <div class="cursor" id="cursor">
    <svg class="c-arrow" width="24" height="24" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.4 2.9 6.6 2.9-1.3-2.9-6.5h6.4z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
    <svg class="c-hand" width="22.07" height="23.87" viewBox="0 0 22.0722 23.8667" fill="none"><path d="M9.23 20.933H13.048C13.092 20.933 13.135 20.916 13.166 20.884L14.262 19.789C14.383 19.668 14.547 19.6 14.718 19.6C14.963 19.6 15.186 19.738 15.296 19.957L15.759 20.884C15.775 20.914 15.805 20.933 15.839 20.933H17.412C17.618 20.933 17.784 20.767 17.784 20.562C17.784 19.052 18.135 17.564 18.81 16.214C19.675 14.485 20.727 12.734 20.417 10.716L20.175 9.134C20.098 8.635 19.669 8.267 19.164 8.267H18.98C18.517 8.267 18.142 8.642 18.142 9.105V9.765C18.142 9.864 18.062 9.944 17.963 9.944C17.864 9.944 17.784 9.864 17.784 9.765V8.267C17.784 7.53 17.187 6.933 16.451 6.933C15.714 6.933 15.117 7.53 15.117 8.267V9.794C15.117 9.978 14.968 10.127 14.784 10.127C14.6 10.127 14.451 9.978 14.451 9.794V8.267C14.451 7.53 13.854 6.933 13.117 6.933C12.381 6.933 11.784 7.53 11.784 8.267V10.188C11.784 10.24 11.772 10.291 11.749 10.337C11.626 10.583 11.275 10.583 11.153 10.337C11.129 10.291 11.117 10.24 11.117 10.188V3.6C11.117 2.731 10.409 1.6 9.451 1.6C8.492 1.6 7.784 2.731 7.784 3.6V11.844C7.784 12.077 7.595 12.267 7.361 12.267C7.21 12.267 7.071 12.187 6.994 12.057C6.737 11.626 6.14 10.649 5.784 10.267C5.583 10.051 5.181 9.897 4.789 9.792C4.181 9.629 3.565 9.929 3.216 10.452C2.771 11.12 2.859 12.008 3.426 12.576L4.521 13.671C4.913 14.063 5.209 14.541 5.384 15.067L5.451 15.267C5.67 15.924 6.039 16.522 6.529 17.012L8.254 18.737C8.807 19.29 9.117 20.039 9.117 20.821C9.117 20.883 9.168 20.933 9.23 20.933Z" fill="#fff" stroke="#000" stroke-width="0.8"/><path d="M11.487 12.744V17.875M14.119 12.744V17.875M16.815 12.744V17.875" stroke="#000" stroke-width="0.8"/></svg>
  </div>
</div>

<script>
/* ---------- icons (Lucide at 16px) ---------- */
const ICONS = {
  'house': '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  'chevrons-left-right-ellipsis': '<path d="M12 12h.01"/><path d="M16 12h.01"/><path d="m17 7 5 5-5 5"/><path d="m7 7-5 5 5 5"/><path d="M8 12h.01"/>',
  'flask-conical': '<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
  'arrow-right': '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  'plus': '<path d="M5 12h14"/><path d="M12 5v14"/>',
};
const icon = name => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
const $ = id => document.getElementById(id);

/* ---------- history ----------
   Service groups, indented where one inherits from the group above, and the three releases Figma
   fills in (its older columns are placeholder copies), each giving every group an MCU firmware and
   the config it was built against. The HMI app is 3.5.8 throughout. */
const GROUPS = [['AG1.0', false], ['AG 1.0.5', true], ['AG 1.0.6', false], ['AG 1.1', false], ['AG 1.1_KR', true], ['AG 1.1_US', true], ['AG 1.1_EU', true]];
const PLANS = [
  ['FW 3.5.11', [['v1.0.2', '3.5.11'], ['v1.0.3a-no_corr', '3.5.11-bas'], ['v1.0.5a', '3.5.11-bas'], ['v1.1g', '3.5.11'], ['v1.1g', '3.5.11-bas'], ['v1.1g-lotteria', '3.5.11'], ['v1.1gMoms', '3.5.11']]],
  ['FW 3.5.12', [['v1.0.2', '3.5.12'], ['v1.0.3a-no_corr', '3.5.12'], ['v1.0.5a', '3.5.12'], ['v1.1g', '3.5.12'], ['v1.1g-KR', '3.5.12'], ['v1.1g-US', '3.5.12'], ['v1.1g-EU', '3.5.12']]],
  // Figma's label carries a leading space
  [' FW 3.6.0', [['v1.0.2', '3.6.0'], ['v1.0.3a-no_corr', '3.6.0-bas'], ['v1.0.5a', '3.6.0-bas'], ['v1.1g', '3.6.0'], ['v1.1g', '3.6.0-bas'], ['v1.1g-lotteria', '3.6.0'], ['v1.1g-moms', '3.6.0']]],
];
const last = i => (i === GROUPS.length - 1 ? ' last' : '');
$('plans').style.setProperty('--rows', GROUPS.length);
$('sg').innerHTML = '<div class="hd"></div>' + GROUPS.map(([name, indent], i) =>
  `<div class="r${last(i)}" data-r="${i}">${indent ? '<span class="indent">↪</span>' : ''}${name}</div>`).join('');
$('track').innerHTML = PLANS.map(([label, rows], c) => `
  <div class="plan" data-c="${c}">
    <div class="hd"><span class="t">${label}</span>${c < PLANS.length - 1 ? icon('arrow-right') : ''}</div>
    ${rows.map(([fw, cfg], i) => `<div class="cell${last(i)}" data-r="${i}"><span class="badge hmi">3.5.8</span><span class="sep"></span><span class="fw"><span class="ver">${fw}</span><span class="at">@</span><span class="badge mcu">${cfg}</span></span></div>`).join('')}
  </div>`).join('');
document.querySelectorAll('i[data-icon]').forEach(i => { i.outerHTML = icon(i.dataset.icon); });

const table = $('table'), plans = $('plans');
// Each edge's shading builds over the last ~20 on-screen px before that edge, so a drag eases it in
// and out instead of switching it at the first pixel. Measured on screen, so it reads the same
// however far fit() has scaled the stage.
const EDGE_RAMP = 20;
let scale = 1;
const edges = () => {
  const ramp = EDGE_RAMP / scale;
  const left = plans.scrollLeft, right = plans.scrollWidth - plans.clientWidth - left;
  table.style.setProperty('--start', Math.min(1, Math.max(0, left) / ramp));
  table.style.setProperty('--end', Math.min(1, Math.max(0, right) / ramp));
};
plans.addEventListener('scroll', edges, { passive: true });
edges();
// Nothing here scrolls vertically, so a vertical wheel moves the releases sideways.
plans.addEventListener('wheel', e => {
  if (Math.abs(e.deltaY) <= Math.abs(e.deltaX)) return;
  e.preventDefault();
  plans.scrollLeft += e.deltaY;
}, { passive: false });

let lit = { r: null, c: null };
// A real pointer over the page (the lightbox's copy) has the table to itself: the loop neither lights
// nor scrolls it until the pointer leaves.
const live = () => root.classList.contains('live');
function light(r, c) {
  if (r === lit.r && c === lit.c) return;
  document.querySelectorAll('.hr').forEach(el => el.classList.remove('hr'));
  document.querySelectorAll('.hc').forEach(el => el.classList.remove('hc'));
  if (r != null) document.querySelectorAll(`[data-r="${r}"]`).forEach(el => el.classList.add('hr'));
  if (c != null) document.querySelector(`.plan[data-c="${c}"]`).classList.add('hc');
  lit = { r, c };
}
table.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch') return;
  const r = e.target.closest('[data-r]')?.dataset.r ?? null;
  const c = e.target.closest('.plan')?.dataset.c ?? null;
  light(r, c);
});
table.addEventListener('pointerleave', () => light(null, null));

/* ---------- a config's release ---------- */
// When each release went out and who released it, and the parameter set (as the firmware generator
// imports them) each group's config was built from in it.
const RELEASES = [['May 28, 2025', 'H. Cho'], ['Jun 24, 2025', 'D. Lee'], ['Jul 14, 2025', 'J. Kim']];
const PARAM_SET = ['SPAT v1.1.4', 'SPAT v1.1.5'];
const PARAM_SET_NEWEST = ['SPAT v1.1.5', 'WIPR v1.1.5', 'SPAT v1.1.5_0305', 'SCRB v1.1.5', 'SCRB v1.1.5_test02', 'WIPR v1.1.5_temp', 'SPAT v1.1.5_0305'];
const paramSet = (r, c) => (c === PLANS.length - 1 ? PARAM_SET_NEWEST[r] : PARAM_SET[c]);
const cell = (r, c) => document.querySelector(`.plan[data-c="${c}"] .cell[data-r="${r}"]`);
function showTip(r, c) {
  const [date, by] = RELEASES[c];
  $('tipCfg').textContent = paramSet(r, c);
  $('tipWhen').textContent = `Released ${date} · ${by}`;
  // Centred over the config, 8px above it. One that's opening appears there, rising in; one that's
  // open slides over from the last.
  const tip = $('tip'), b = stageBox(cell(r, c).querySelector('.fw'));
  const opening = !tip.classList.contains('on');
  if (opening) tip.style.transition = 'none';
  tip.style.setProperty('--x', `${b.cx - tip.offsetWidth / 2}px`);
  tip.style.setProperty('--y', `${b.top - tip.offsetHeight - 8}px`);
  if (opening) { tip.offsetHeight; tip.style.transition = ''; }
  tip.classList.add('on');
}
const hideTip = () => $('tip').classList.remove('on');
const underline = el => document.querySelectorAll('.ver').forEach(v => v.classList.toggle('u', v === el));

/* ---------- the loop ----------
   As in the other prototypes, waits are scheduled against the wall clock rather than chained
   timeouts: step n of the loop lands at loopStart + (sum of waits up to n), and an embedded copy
   takes loopStart from Date.now() too, so the carousel card and its lightbox copy show the same
   moment. A wait whose time has passed returns at once, which is how a copy that starts mid-loop
   catches up; the first that hasn't is the first moment the scene is in place. */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let runId = 0, loopStart = 0, vt = 0, dry = false, caughtUp = false;
async function wait(ms, id) {
  if (id !== runId) throw 'abort';
  vt += ms;
  if (dry) return;
  while (true) {
    if (id !== runId) throw 'abort';
    const left = loopStart + vt - Date.now();
    if (left <= 0) return;
    if (!caughtUp) markCaughtUp();
    await sleep(Math.min(left, 30));
  }
}
async function loop() {
  const id = ++runId;
  try {
    // Measure the loop with a dry run (every wait returns at once), so a synced copy can find its place in it.
    dry = true; vt = 0; await play(id); dry = false;
    const length = vt;
    while (true) {
      const now = Date.now();
      loopStart = root.classList.contains('embed') ? now - (now % length) : now;
      vt = 0;
      await play(id);
    }
  } catch (e) { dry = false; if (e !== 'abort') throw e; }
}

/* ---------- the pointer ----------
   Points are stage px, measured off the elements they're over. */
const cursor = $('cursor');
function stageBox(el) {
  const st = $('stage'), s = st.getBoundingClientRect(), b = el.getBoundingClientRect();
  const k = s.width / st.offsetWidth;
  return { left: (b.left - s.left) / k, top: (b.top - s.top) / k, right: (b.right - s.left) / k, bottom: (b.bottom - s.top) / k,
           cx: ((b.left + b.right) / 2 - s.left) / k, cy: ((b.top + b.bottom) / 2 - s.top) / k };
}
function jump(x, y) {
  cursor.style.transition = 'none'; cursor.classList.remove('hand');
  cursor.style.transform = `translate(${x}px, ${y}px)`;
  cursor.offsetHeight; cursor.style.transition = ''; cursor.classList.add('on');
}
async function moveTo(x, y, id, ms = 560, hand = false) {
  if (!hand) cursor.classList.remove('hand');
  cursor.style.transitionDuration = `${ms}ms, 200ms`;
  cursor.style.transform = `translate(${x}px, ${y}px)`;
  await wait(ms, id);
  cursor.classList.toggle('hand', hand);
}
// Over a cell's config, its row and release lit once the pointer's most of the way there.
async function toConfig(r, c, id, ms) {
  const ver = cell(r, c).querySelector('.ver'), b = stageBox(ver);
  cursor.style.transitionDuration = `${ms}ms, 200ms`;
  cursor.style.transform = `translate(${b.cx}px, ${b.cy + 3}px)`;
  await wait(ms * 0.6, id);
  if (!live()) light(r, c);
  underline(ver); cursor.classList.add('hand');
  await wait(ms * 0.4, id);
}
// The releases eased sideways, on the loop's clock; at once while catching up.
async function scrollTo(left, id, ms) {
  if (live()) return wait(ms, id);
  const from = plans.scrollLeft, t0 = Date.now();
  if (!caughtUp || dry) { plans.scrollLeft = left; return wait(ms, id); }
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - (-2 * t + 2) ** 3 / 2);
  const step = () => {
    const t = Math.min(1, (Date.now() - t0) / ms);
    plans.scrollLeft = from + (left - from) * ease(t);
    if (t < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
  await wait(ms, id);
}

async function play(id) {
  hideTip(); underline(null); aim(null);
  if (!live()) { light(null, null); plans.scrollLeft = 0; }
  // From the room under the table
  const sg = stageBox($('sg'));
  const rest = [sg.left + 150, stageBox(cell(GROUPS.length - 1, 0)).bottom + 70];
  jump(...rest);
  await wait(900, id);

  // onto AG 1.1_KR's name, lighting its row, then along that row to the newest release, the square
  // card's camera in on the group and then panning with the releases
  const group = stageBox(document.querySelector('#sg .r[data-r="4"]'));
  aim({ x: group.left - 8, y: 0, w: 560, h: 560 });
  await moveTo(group.left + 150, group.cy + 3, id, 720);
  if (!live()) light(4, null);
  await wait(800, id);
  aim({ x: $('stage').offsetWidth - 560, y: 0, w: 560, h: 560 });
  await scrollTo(plans.scrollWidth - plans.clientWidth, id, 1100);
  await wait(200, id);

  // the newest release's configs, each telling its release
  await toConfig(4, 2, id, 640);
  await wait(260, id);
  showTip(4, 2);
  await wait(1500, id);
  await toConfig(5, 2, id, 420);
  showTip(5, 2);
  await wait(1900, id);
  await toConfig(6, 2, id, 400);
  showTip(6, 2);
  await wait(1400, id);

  // and away, the camera back out, back to the oldest for the next
  hideTip(); underline(null); aim(null);
  cursor.classList.remove('hand');
  cursor.style.transitionDuration = '760ms, 200ms';
  cursor.style.transform = `translate(${rest[0]}px, ${rest[1]}px)`;
  await wait(200, id);
  if (!live()) light(null, null);
  await wait(560, id);
  await scrollTo(0, id, 1000);
  await wait(800, id);
}

/* ---------- embedding ----------
   Same handshake as the other prototypes: once the fonts are in, the loop starts, and once it has
   caught up and that frame has painted, transitions come back and an embedding page is told this one
   is ready to show (and told again if it asks with "proto:ping", in case it only started listening
   after the page had loaded). */
const SCENE = 'history';
const root = document.documentElement;
if (new URLSearchParams(location.search).has('embed')) root.classList.add('embed');
let shown = false;
const announce = () => { if (parent !== window) parent.postMessage({ type: 'proto:ready', scene: SCENE }, location.origin); };
addEventListener('message', e => { if (e.origin === location.origin && e.data === 'proto:ping' && shown) announce(); });
function markCaughtUp() {
  caughtUp = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.classList.remove('no-anim');
    shown = true;
    announce();
  }));
}
addEventListener('pointermove', e => { if (e.pointerType !== 'touch') root.classList.add('live'); }, { passive: true });
root.addEventListener('pointerleave', () => { root.classList.remove('live'); light(null, null); });
document.fonts.ready.then(loop);

/* ---------- framing ----------
   The stage scales to fit the frame. On the square phone card the frame is the whole card instead
   (update-history-demo.tsx), and the page frames the narrower screen in it with a camera: by
   default from 40 stage px above and left of its top-left corner, so its top and side show and it
   reads as a screen before the camera moves in, cut at the right and the foot; aim() moves it in on
   a view (a box of stage px brought to fill the card) and aim(null) back out. Elsewhere it stays put. */
const BASE_VIEW = () => ({ x: -40, y: -40, w: 820, h: 820 });
let view = null;
const isSquare = () => innerWidth < (innerHeight * 7) / 6;
// The card the page is framed into (live-prototype.tsx), whose shape says which layout: 4:3 is
// .compact. The lightbox's copy is 16:9.
const card = frameElement?.closest('[data-live-prototype]');
function place() {
  const st = $('stage');
  const square = isSquare();
  root.classList.toggle('square', square);
  root.classList.toggle('compact', !square && !!card && card.clientWidth < card.clientHeight * 1.55);
  const W = st.offsetWidth, H = st.offsetHeight;
  const v = square ? view ?? BASE_VIEW() : null;
  const k = v ? Math.min(innerWidth / v.w, innerHeight / v.h) : Math.min(innerWidth / W, innerHeight / H);
  const [tx, ty] = v ? [-k * (v.x + v.w / 2 - W / 2), -k * (v.y + v.h / 2 - H / 2)] : [0, 0];
  st.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
  return k;
}
const aim = v => { view = v; scale = place(); };
// A resize lands at once rather than gliding there.
function fit() {
  const st = $('stage');
  st.style.transition = 'none'; scale = place(); edges(); st.offsetHeight; st.style.transition = '';
}
addEventListener('resize', fit); fit();
addEventListener('keydown', e => {
  if (!root.classList.contains('embed')) return;
  // A click into the lightbox's live copy moves keyboard focus into this page, so hand the
  // lightbox's own keys back to it.
  if (e.key === 'Escape' || e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault();
    parent.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, code: e.code, bubbles: true, cancelable: true }));
  }
});
</script>
</body>
</html>
