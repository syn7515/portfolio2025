<!doctype html>
<html lang="en" class="no-anim">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Update manager — prototype</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  /* iOS Safari enlarges text it judges too small to read, weighing each block of text's width
     against the viewport's. The screen here is laid out at its full size and scaled down to the
     frame, so its long lines (titles, descriptions) came out a size or two larger than the rest.
     The sizes set here are the design; leave them be. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  /* The "manager-4" Figma frame: the release screen of the update manager, in light mode. Figma draws
     it at 0.891× (1059×661); this page is built at the base size it stands for (14px body text, 40px
     rows), 742px tall, though 1060px across rather than Figma's 1189, its margins either side of the
     form brought in, and the stage scales to fit. A scripted pointer plays it on a loop (the script):
     a group that needs an update brings up its last release, carried over, as it's hovered, and the
     pointer changes only what differs. */
  /* In dark, as the firmware prototype's screens are in this post: stone surfaces (#1c1917), the
     sidebar on the same with only its rule to set it off (light mode tints it), the lifted fills a
     step lighter, light text, and a light primary with dark text on it. */
  :root {
    --bg: #1c1917;
    --fg: #d6d3d1;
    --card-fg: #e7e5e4;
    --muted-fg: #a8a29e;
    --border: #383431;
    --soft-border: rgba(68, 64, 60, 0.5);
    --secondary: #292524;
    --primary: #d6d3d1;
    --primary-fg: #1c1917;
    --focus: #57534e;
    /* the faint lift the table and the text fields share */
    --lift: 0 1px 2px rgba(0, 0, 0, 0.2), 0 2px 6px rgba(0, 0, 0, 0.12);
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
    --sans: "Pretendard Variable", Pretendard, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #0c0a09; overflow: hidden; }
  /* Embedded, fill with the screen colour: the scaled stage can miss the frame edge by a sub-pixel. */
  .embed, .embed body { background: var(--bg); }
  /* On the square card the frame is the whole card and the screen sits within it (place), on it,
     laid out 838px across: the margins either side of the release form go, and the table comes in
     with it, its cells padded 12px rather than 16 and each column to what it holds, "This release"
     the rest. The form keeps 56px either side (32 elsewhere), more room round the smaller table.
     It runs 900px down, past the card's foot, the fields under the table carrying on past it. */
  .square.embed, .square.embed body { background: transparent; }
  .square #stage { width: 838px; height: 900px; margin: -450px 0 0 -419px; }
  .square .intro, .square .main { padding-left: 56px; padding-right: 56px; }
  .square .tr > div { padding: 0 12px; }
  .square .c1 { width: 96px; }
  .square .c2 { width: 240px; }
  .square .c3 { width: 32px; }
  /* On the 4:3 card (.compact, from the card's shape in the script) the last release's column comes
     in to 250px, and the form and screen 66px with it, so the whole screen fits across the card. */
  .compact #stage { width: 994px; margin-left: -497px; }
  .compact .wrap { max-width: 774px; }
  .compact .c2 { width: 250px; }
  body { font-family: var(--sans); font-size: 14px; line-height: 20px; color: var(--fg); -webkit-font-smoothing: antialiased; }
  svg { display: block; }
  .ic { width: 16px; height: 16px; flex-shrink: 0; }

  #stage { position: absolute; left: 50%; top: 50%; width: 1060px; height: 742px; margin: -371px 0 0 -530px; background: var(--bg); overflow: hidden; display: flex; transform-origin: center;
           transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1); }
  /* Figma's 1px frame outline, drawn over everything so it doesn't take layout room */
  #stage::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 1.12px rgba(255, 255, 255, 0.06); pointer-events: none; z-index: 30; }

  /* sidebar */
  .sidebar { width: 48px; flex-shrink: 0; background: var(--bg); border-right: 1px solid var(--soft-border); display: flex; flex-direction: column; }
  .sb-head { padding: 14px 8px 36px; }
  .sb-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .sb-btn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 6px; color: var(--muted-fg); transition: background-color 90ms ease; }
  .sb-btn.on { background: var(--border); color: var(--fg); }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .crumbs { height: 48px; flex-shrink: 0; padding: 0 32px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border); }
  .crumbs .p { color: var(--muted-fg); }
  .wrap { width: 100%; max-width: 840px; margin: 0 auto; }
  .intro { padding: 40px 32px 24px; background: rgba(41, 37, 36, 0.5); }
  .intro .t { font-size: 16px; line-height: 24px; font-weight: 500; color: var(--card-fg); }
  .intro .d { margin-top: 4px; color: var(--muted-fg); }
  .main { padding: 40px 32px 64px; }
  .main .wrap { display: flex; flex-direction: column; gap: 40px; align-items: flex-start; }
  .label { font-weight: 500; }
  .desc { margin-top: 4px; color: var(--muted-fg); }

  /* release table */
  .table { width: 100%; margin-top: 24px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
           box-shadow: var(--lift); }
  .tr { display: flex; height: 40px; }
  .tr + .tr { border-top: 1px solid var(--border); }
  .tr > div { display: flex; align-items: center; padding: 0 16px; min-width: 0; }
  .c1 { width: 160px; flex-shrink: 0; color: var(--muted-fg); border-right: 1px solid var(--soft-border); }
  .c2 { width: 316px; flex-shrink: 0; }
  .c3 { width: 48px; flex-shrink: 0; justify-content: center; padding: 0 !important; color: var(--muted-fg); }
  .c4 { flex: 1; background: rgba(41, 37, 36, 0.4); }
  .thead { background: rgba(41, 37, 36, 0.4); }
  .thead > div { font-weight: 500; line-height: 24px; color: var(--muted-fg); border-right: none; background: none; }
  .thead .c3 { opacity: 0.5; }
  .sw { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  /* A group's last release fades once its release here is set, superseded. */
  .c2 .sw { transition: opacity 250ms ease; }
  .tr.set .c2 .sw { opacity: 0.5; }
  .sep { width: 0; height: 12px; border-left: 1px solid var(--border); }
  .fw { display: flex; align-items: center; gap: 2px; color: var(--muted-fg); }
  .fw .at { opacity: 0.5; }
  .badge { display: inline-flex; align-items: center; padding: 1px 4px; min-width: 18px; border-radius: 4px; font-family: var(--mono); font-size: 10.69px; line-height: 14.25px; white-space: nowrap; }
  /* both filled badges are the secondary kind: a muted fill, no stroke */
  .badge.hmi, .badge.mcu { background: var(--secondary); color: var(--primary); transition: background-color 90ms ease; }
  /* "This release": blank, and the arrow to it, until a group that needs an update is hovered, which
     brings up three dropdowns holding its last release, carried over. Set, the group keeps both, the
     dropdowns settling back to their values once the pointer has moved on. */
  .tr.upd .c3 .ic, .tr.upd .c4 .sw { opacity: 0; transition: opacity 180ms ease; }
  /* .focus: the row a picker is open on, which keeps it up whatever the pointer is over */
  .tr.upd.hover .c3 .ic, .tr.upd.hover .c4 .sw, .tr.upd.focus .c3 .ic, .tr.upd.focus .c4 .sw, .tr.upd.set .c3 .ic, .tr.upd.set .c4 .sw { opacity: 1; }
  .c4 .sw { gap: 8px; }
  .c4 .fw { gap: 4px; }
  .pick { display: inline-flex; align-items: center; gap: 3px; height: 24px; padding: 0 5px 0 4px; border-radius: 5px;
          transition: background-color 90ms ease, box-shadow 90ms ease; }
  .pick .chev { width: 10px; height: 10px; color: var(--muted-fg); }
  .tr.upd.hover .pick, .tr.upd.focus .pick { background: var(--bg); box-shadow: inset 0 0 0 1px var(--border), 0 1px 2px rgba(0, 0, 0, 0.2); }
  .tr.upd .pick.open, .tr.upd.hover .pick.hover { background: var(--secondary); }
  .pick .cfgv { font-family: var(--mono); font-size: 12px; line-height: 16px; color: var(--muted-fg); }

  /* form */
  .field-group { width: 420px; display: flex; flex-direction: column; gap: 8px; }
  .input { height: 34px; padding: 0 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); box-shadow: var(--lift); transition: box-shadow 120ms ease; }
  .textarea { position: relative; height: 108px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); box-shadow: var(--lift); transition: box-shadow 120ms ease; }
  .input input, .textarea textarea { width: 100%; height: 100%; border: 0; outline: 0; background: none; font: inherit; color: var(--fg); resize: none; -webkit-user-select: text; user-select: text; }
  .input:focus-within, .textarea:focus-within { box-shadow: 0 0 0 1px var(--focus), var(--lift); }
  .resize { position: absolute; right: -1px; bottom: -1px; width: 20px; height: 20px; opacity: 0.6; pointer-events: none; }
  .btn { padding: 6px 12px; min-width: 64px; border-radius: 6px; background: var(--primary); color: var(--primary-fg); font-weight: 500; transition: opacity 90ms ease, filter 90ms ease; }

  /* A part's version picker: the combobox popover, dark in both themes, lifted off the dark screen
     by a firmer edge and a shadow */
  .menu { position: absolute; z-index: 20; width: 214.4px; height: 237.1px; display: flex; flex-direction: column; background: #1c1917; border: 1px solid #44403c; border-radius: 6px; overflow: hidden; color: #fafaf9;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45), 0 2px 6px rgba(0, 0, 0, 0.3); }
  .menu[hidden] { display: none; }
  .m-search { display: flex; align-items: center; gap: 8px; padding: 10px 12px; flex-shrink: 0; background: rgba(41, 37, 36, 0.5); border-bottom: 1px solid rgba(68, 64, 60, 0.7); color: #a8a29e; }
  .m-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; color: #fafaf9; -webkit-user-select: text; user-select: text; }
  .m-search input::placeholder { color: rgba(250, 250, 249, 0.5); }
  .m-list { flex: 1; overflow-y: auto; padding: 4px; background: rgba(41, 37, 36, 0.5); scrollbar-width: thin; scrollbar-color: rgba(87, 83, 78, 0.3) transparent; }
  .m-list::-webkit-scrollbar { width: 10px; }
  .m-list::-webkit-scrollbar-thumb { background: rgba(87, 83, 78, 0.3); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
  .m-item { padding: 6px 8px; border-radius: 4px; }
  .m-item.current { background: rgba(68, 64, 60, 0.6); }
  .m-item.hl { background: #1c1917; }
  .m-empty { padding: 6px 8px; color: rgba(250, 250, 249, 0.5); }

  /* ---------- the pointer ----------
     macOS-size pointers against the 1:1 screen, as in the other prototypes: Figma's "Cursor / Hand"
     and an arrow to match, each offset so its hotspot sits on the point, presses scaling about it.
     A real pointer (the lightbox's copy) puts it out of sight, so there's only one. */
  .cursor { position: absolute; z-index: 25; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0;
            transition: transform 520ms cubic-bezier(0.4, 0, 0.2, 1), opacity 200ms ease; }
  .cursor.on { opacity: 1; }
  .cursor svg { position: absolute; overflow: visible; filter: drop-shadow(-0.67px 0.67px 0.93px rgba(0, 0, 0, 0.6)); }
  .cursor .c-arrow { left: -5px; top: -2.5px; transform-origin: 5px 2.5px; }
  .cursor .c-hand { display: none; left: -9.45px; top: -1.6px; transform-origin: 9.45px 1.6px; }
  .cursor.hand .c-arrow { display: none; }
  .cursor.hand .c-hand { display: block; }
  .cursor.down svg { transform: scale(0.9); }
  .live .cursor.on { opacity: 0; }

  /* ---------- real pointer input ----------
     In the lightbox the page takes real hover (on the carousel card it's inert): the scripted pointer
     steps aside and the selects, buttons and picker rows show hover and press, though the loop keeps
     the picking to itself. The text fields edit. Other text doesn't select. */
  html { -webkit-user-select: none; user-select: none; cursor: default; }
  /* Hover only where a pointer can hover: on a touch screen a tap would leave it stuck on. */
  @media (hover: hover) and (pointer: fine) {
    .sb-btn:not(.on):hover { background: var(--border); }
    .tr.upd:hover .c3 .ic, .tr.upd:hover .c4 .sw { opacity: 1; }
    .tr.upd:hover .pick { background: var(--bg); box-shadow: inset 0 0 0 1px var(--border), 0 1px 2px rgba(0, 0, 0, 0.2); }
    .tr.upd:hover .pick:hover { background: var(--secondary); }
    .m-item:hover { background: #1c1917; }
    .btn:hover { opacity: 0.9; }
  }
  .sb-btn:active, .btn:active, .pick:active, .m-item:active { filter: brightness(0.9); }
  .no-anim, .no-anim * { transition: none !important; }
</style>
</head>
<body>
<div id="stage">
  <aside class="sidebar">
    <div class="sb-head"><div class="sb-btn"><svg class="ic" viewBox="0 0 21.3333 21.3333"><path d="M10.6664 1.77561C15.096 1.77561 18.6613 5.30172 18.6674 9.62326V19.5578H17.4047V10.5207H17.4057V9.63401C17.4054 5.95134 14.3741 2.99045 10.6664 2.99045C6.95882 2.99047 3.92843 5.95097 3.92817 9.63401V9.63498C3.92858 13.3178 6.9586 16.2795 10.6664 16.2795H11.8745L12.2651 17.4934H10.6664C8.64409 17.4934 6.80249 16.7541 5.39399 15.5393L3.92817 14.2746V19.5578H2.6645V9.63401C2.66476 5.30753 6.23327 1.77563 10.6664 1.77561Z" stroke="#A8A29E" stroke-width="1.77333" fill="none"/></svg></div></div>
    <div class="sb-list">
      <div class="sb-btn"><i data-icon="house"></i></div>
      <div class="sb-btn on"><i data-icon="chevrons-left-right-ellipsis"></i></div>
      <div class="sb-btn"><i data-icon="flask-conical"></i></div>
    </div>
  </aside>
  <div class="content">
    <div class="crumbs"><span class="p">Release center</span><i data-icon="chevron-right" style="color: var(--muted-fg)"></i><span>New release</span></div>
    <div class="intro"><div class="wrap"><div class="t">Release firmware</div><div class="d">Configure firmware version for field deployment.</div></div></div>
    <div class="main"><div class="wrap">
      <div style="width: 100%">
        <div class="label">Firmware for this release</div>
        <div class="desc">Configure versions for the service groups that need updates.</div>
        <div class="table" id="table">
          <div class="tr thead"><div class="c1"></div><div class="c2">Recently released firmware</div><div class="c3"><i data-icon="arrow-right"></i></div><div class="c4">This release</div></div>
        </div>
      </div>
      <div class="field-group"><div class="label">Update summary</div><div class="input"><input value="FW 3.6.0" spellcheck="false" /></div></div>
      <div class="field-group" style="height: 136px"><div class="label">Note</div><div class="textarea"><textarea spellcheck="false">Supports new firmware build workflow and minor bug fix</textarea><svg class="resize" viewBox="0 0 17.815 17.815"><path d="M15.7189 9.48302C15.8928 9.30938 16.1749 9.3092 16.3487 9.48302C16.5226 9.65686 16.5224 9.93895 16.3487 10.1129L10.1124 16.3483C9.93846 16.5219 9.65734 16.5221 9.48351 16.3483C9.30969 16.1744 9.30987 15.8933 9.48351 15.7194L15.7189 9.48302ZM15.6876 13.0152C15.8615 12.8414 16.1436 12.8413 16.3175 13.0152C16.4911 13.1892 16.4913 13.4713 16.3175 13.6451L13.6339 16.3287C13.4601 16.5024 13.1779 16.5023 13.004 16.3287C12.8301 16.1548 12.8302 15.8728 13.004 15.6988L15.6876 13.0152Z" fill="#A8A29E"/></svg></div></div>
      <div class="btn">Release firmware group</div>
    </div></div>
  </div>

  <div class="menu" id="menu" hidden>
    <div class="m-search"><i data-icon="search"></i><input id="mSearch" readonly tabindex="-1" spellcheck="false" /></div>
    <div class="m-list" id="mList"></div>
  </div>

  <div class="cursor" id="cursor">
    <svg class="c-arrow" width="24" height="24" viewBox="0 0 24 24"><path d="M5 2.5v17.2l4.6-4.4 2.9 6.6 2.9-1.3-2.9-6.5h6.4z" fill="#fff" stroke="#000" stroke-width="1.2" stroke-linejoin="round"/></svg>
    <svg class="c-hand" width="22.07" height="23.87" viewBox="0 0 22.0722 23.8667" fill="none"><path d="M9.23 20.933H13.048C13.092 20.933 13.135 20.916 13.166 20.884L14.262 19.789C14.383 19.668 14.547 19.6 14.718 19.6C14.963 19.6 15.186 19.738 15.296 19.957L15.759 20.884C15.775 20.914 15.805 20.933 15.839 20.933H17.412C17.618 20.933 17.784 20.767 17.784 20.562C17.784 19.052 18.135 17.564 18.81 16.214C19.675 14.485 20.727 12.734 20.417 10.716L20.175 9.134C20.098 8.635 19.669 8.267 19.164 8.267H18.98C18.517 8.267 18.142 8.642 18.142 9.105V9.765C18.142 9.864 18.062 9.944 17.963 9.944C17.864 9.944 17.784 9.864 17.784 9.765V8.267C17.784 7.53 17.187 6.933 16.451 6.933C15.714 6.933 15.117 7.53 15.117 8.267V9.794C15.117 9.978 14.968 10.127 14.784 10.127C14.6 10.127 14.451 9.978 14.451 9.794V8.267C14.451 7.53 13.854 6.933 13.117 6.933C12.381 6.933 11.784 7.53 11.784 8.267V10.188C11.784 10.24 11.772 10.291 11.749 10.337C11.626 10.583 11.275 10.583 11.153 10.337C11.129 10.291 11.117 10.24 11.117 10.188V3.6C11.117 2.731 10.409 1.6 9.451 1.6C8.492 1.6 7.784 2.731 7.784 3.6V11.844C7.784 12.077 7.595 12.267 7.361 12.267C7.21 12.267 7.071 12.187 6.994 12.057C6.737 11.626 6.14 10.649 5.784 10.267C5.583 10.051 5.181 9.897 4.789 9.792C4.181 9.629 3.565 9.929 3.216 10.452C2.771 11.12 2.859 12.008 3.426 12.576L4.521 13.671C4.913 14.063 5.209 14.541 5.384 15.067L5.451 15.267C5.67 15.924 6.039 16.522 6.529 17.012L8.254 18.737C8.807 19.29 9.117 20.039 9.117 20.821C9.117 20.883 9.168 20.933 9.23 20.933Z" fill="#fff" stroke="#000" stroke-width="0.8"/><path d="M11.487 12.744V17.875M14.119 12.744V17.875M16.815 12.744V17.875" stroke="#000" stroke-width="0.8"/></svg>
  </div>
</div>

<script>
/* ---------- icons (Lucide at 16px, as Figma's 14.25px at 0.891×) ---------- */
const ICONS = {
  'house': '<path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  'chevrons-left-right-ellipsis': '<path d="M12 12h.01"/><path d="M16 12h.01"/><path d="m17 7 5 5-5 5"/><path d="m7 7-5 5 5 5"/><path d="M8 12h.01"/>',
  'flask-conical': '<path d="M14 2v6a2 2 0 0 0 .245.96l5.51 10.08A2 2 0 0 1 18 22H6a2 2 0 0 1-1.755-2.96l5.51-10.08A2 2 0 0 0 10 8V2"/><path d="M6.453 15h11.094"/><path d="M8.5 2h7"/>',
  'chevron-right': '<path d="m9 18 6-6-6-6"/>',
  'arrow-right': '<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',
  'search': '<path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/>',
};
const icon = (name, style = '') => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"${style ? ` style="${style}"` : ''}>${ICONS[name]}</svg>`;
const $ = id => document.getElementById(id);

/* ---------- release table ---------- */
// [service group, recently released MCU firmware, its config version, needs an update]
const GROUPS = [
  ['AG 1.0', 'v1.0.2', '3.5.12', false],
  ['AG 1.0.5', 'v1.1g-moms', '3.5.12', true],
  ['AG 1.0.6', 'v1.0.5a', '3.5.12-bas', true],
  ['AG 1.1_KR', 'v1.1g', '3.5.12', true],
  ['AG 1.1_US', 'v1.1g', '3.5.12-bas', true],
  ['AG 1.1_EU', 'v1.1g-lotteria', '3.5.12', false],
];
const sw = (hmi, fw, cfg) => `<span class="badge hmi">${hmi}</span><span class="sep"></span><span class="fw">${fw}<span class="at">@</span><span class="badge mcu">${cfg}</span></span>`;
const CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
// "This release" for a group that needs an update: the three parts as selects.
const picks = (hmi, fw, cfg) => `<span class="pick" data-part="hmi"><span class="badge hmi">${hmi}</span>${CHEV}</span><span class="sep"></span><span class="fw"><span class="pick" data-part="fw"><span class="cfgv">${fw}</span>${CHEV}</span><span class="at">@</span><span class="pick" data-part="mcu"><span class="badge mcu">${cfg}</span>${CHEV}</span></span>`;
$('table').insertAdjacentHTML('beforeend', GROUPS.map(([group, fw, cfg, update]) => `
  <div class="tr${update ? ' upd' : ''}">
    <div class="c1">${group}</div>
    <div class="c2"><span class="sw">${sw('3.5.8', fw, cfg)}</span></div>
    <div class="c3">${update ? '<i data-icon="arrow-right"></i>' : ''}</div>
    <div class="c4">${update ? '<span class="sw"></span>' : ''}</div>
  </div>`).join(''));
document.querySelectorAll('i[data-icon]').forEach(i => { i.outerHTML = icon(i.dataset.icon, i.getAttribute('style') || ''); });
const rows = [...document.querySelectorAll('#table .tr:not(.thead)')];
const release = i => rows[i].querySelector('.c4 .sw');
const part = (i, name) => rows[i].querySelector(`.pick[data-part="${name}"]`);
// Every group that needs one back to its last release, carried over and not yet set.
function carryOver() {
  GROUPS.forEach(([, fw, cfg, update], i) => {
    if (!update) return;
    release(i).innerHTML = picks('3.5.8', fw, cfg);
    rows[i].classList.remove('set');
  });
}
const hoverRow = i => rows.forEach((r, j) => r.classList.toggle('hover', j === i));

/* ---------- version picker ----------
   Opens under the part it's for, newest first, scrolled so that part's version, marked as current,
   sits second from the top, the newer one over it. Its search narrows the list as it's typed into. */
const VERSIONS = {
  hmi: ['3.5.8', '3.5.7', '3.5.6', '3.5.5', '3.5.4', '3.5.3', '3.5.2', '3.5.1', '3.5.0', '3.4.9', '3.4.8'],
  mcu: ['3.6.0-bas', '3.6.0', '3.5.12-bas', '3.5.12', '3.5.11-bas', '3.5.11', '3.5.10', '3.5.9', '3.5.8', '3.5.7', '3.5.6'],
};
const PLACEHOLDER = { hmi: 'Search HMI app version', mcu: 'Search MCU version' };
const ITEM = 32;
const menu = $('menu'), list = $('mList'), search = $('mSearch');
let picker = null;
function renderList() {
  const q = search.value.trim();
  const shown = VERSIONS[picker.name].filter(v => v.includes(q));
  list.innerHTML = shown.length
    ? shown.map(v => `<div class="m-item${v === picker.current ? ' current' : ''}" data-v="${v}">${v}</div>`).join('')
    : '<div class="m-empty">No version found</div>';
}
const highlight = v => list.querySelectorAll('.m-item').forEach(el => el.classList.toggle('hl', el.dataset.v === v));
const item = v => list.querySelector(`.m-item[data-v="${v}"]`);
function openPicker(el) {
  picker = { el, name: el.dataset.part, current: el.querySelector('.badge, .cfgv').textContent };
  search.value = ''; search.placeholder = PLACEHOLDER[picker.name];
  renderList();
  // Under the part, from its left edge, or from its right where it would run past the table.
  menu.hidden = false;
  const b = stageBox(el), table = stageBox($('table'));
  menu.style.left = `${b.left + menu.offsetWidth > table.right ? b.right - menu.offsetWidth : b.left}px`;
  menu.style.top = `${b.bottom + 10}px`;
  el.closest('.tr').classList.add('focus');
  list.scrollTop = Math.max(0, VERSIONS[picker.name].indexOf(picker.current) - 1) * ITEM;
  el.classList.add('open');
}
function closePicker() {
  menu.hidden = true;
  picker?.el.classList.remove('open');
  rows.forEach(r => r.classList.remove('focus'));
}
// The pick lands in its part, and the group's release is set.
function choose(v) {
  picker.el.querySelector('.badge, .cfgv').textContent = v;
  picker.el.closest('.tr').classList.add('set');
  closePicker();
}

/* ---------- the loop ----------
   As in the other prototypes, waits are scheduled against the wall clock rather than chained
   timeouts: step n of the loop lands at loopStart + (sum of waits up to n), and an embedded copy
   takes loopStart from Date.now() too, so the carousel card and its lightbox copy show the same
   moment. A wait whose time has passed returns at once, which is how a copy that starts mid-loop
   catches up; the first that hasn't is the first moment the scene is in place. */
const sleep = ms => new Promise(r => setTimeout(r, ms));
let runId = 0, loopStart = 0, vt = 0, dry = false, caughtUp = false;
async function wait(ms, id) {
  if (id !== runId) throw 'abort';
  vt += ms;
  if (dry) return;
  while (true) {
    if (id !== runId) throw 'abort';
    const left = loopStart + vt - Date.now();
    if (left <= 0) return;
    if (!caughtUp) markCaughtUp();
    await sleep(Math.min(left, 30));
  }
}
async function loop() {
  const id = ++runId;
  try {
    // Measure the loop with a dry run (every wait returns at once), so a synced copy can find its place in it.
    dry = true; vt = 0; await play(id); dry = false;
    const length = vt;
    while (true) {
      const now = Date.now();
      loopStart = root.classList.contains('embed') ? now - (now % length) : now;
      vt = 0;
      await play(id);
    }
  } catch (e) { dry = false; if (e !== 'abort') throw e; }
}

/* ---------- the pointer ----------
   Points are stage px, measured off the elements they're over. */
const cursor = $('cursor');
function stageBox(el) {
  const st = $('stage'), s = st.getBoundingClientRect(), b = el.getBoundingClientRect();
  const k = s.width / st.offsetWidth;
  return { left: (b.left - s.left) / k, top: (b.top - s.top) / k, right: (b.right - s.left) / k, bottom: (b.bottom - s.top) / k,
           cx: ((b.left + b.right) / 2 - s.left) / k, cy: ((b.top + b.bottom) / 2 - s.top) / k };
}
function jump(x, y) {
  cursor.style.transition = 'none'; cursor.classList.remove('hand');
  cursor.style.transform = `translate(${x}px, ${y}px)`;
  cursor.offsetHeight; cursor.style.transition = ''; cursor.classList.add('on');
}
// A hand stays a hand on the way to another thing to click; otherwise it's the arrow until there.
async function moveTo(x, y, id, ms = 560, hand = false) {
  if (!hand) cursor.classList.remove('hand');
  cursor.style.transitionDuration = `${ms}ms, 200ms`;
  cursor.style.transform = `translate(${x}px, ${y}px)`;
  await wait(ms, id);
  cursor.classList.toggle('hand', hand);
}
async function click(id) {
  cursor.classList.add('down'); await wait(130, id); cursor.classList.remove('down');
}
const over = el => { const b = stageBox(el); return [b.cx + 2, b.cy + 2]; };
// Onto a group's part, its row brought up as the pointer comes into it.
async function toPart(i, name, id, ms) {
  const el = part(i, name);
  cursor.classList.remove('hand');
  cursor.style.transitionDuration = `${ms}ms, 200ms`;
  cursor.style.transform = `translate(${over(el).join('px, ')}px)`;
  await wait(ms * 0.55, id);
  hoverRow(i);
  await wait(ms * 0.45, id);
  cursor.classList.add('hand'); el.classList.add('hover');
}
// The list scrolled by the wheel under the pointer, at once while catching up.
const scrollList = top => list.scrollTo({ top, behavior: caughtUp ? 'smooth' : 'auto' });

// The camera's view of the release columns: from just left of the last release's to just past this
// one's, square, from just over the table's head down, so the open picker shows under either group.
function columnsView() {
  const c2 = stageBox(rows[0].querySelector('.c2')), table = stageBox($('table'));
  const x = c2.left - 12, w = table.right + 12 - x;
  return { x, y: Math.min(table.top - 16, $('stage').offsetHeight - w), w, h: w };
}

async function play(id) {
  closePicker(); carryOver(); hoverRow(-1); aim(null);
  // From beside the table's description
  const desc = stageBox(document.querySelector('.main .desc'));
  const rest = [desc.right + 120, desc.cy + 4];
  jump(...rest);
  await wait(900, id);

  // AG 1.0.5: only its MCU version moves on, found by search. The square card's camera comes in on
  // the two columns, last release and this one, and the picker under them.
  aim(columnsView());
  await toPart(1, 'mcu', id, 820);
  await wait(320, id);
  await click(id);
  part(1, 'mcu').classList.remove('hover');
  openPicker(part(1, 'mcu'));
  await wait(420, id);
  for (const [i, q] of ['3', '3.', '3.6'].entries()) {
    search.value = q; renderList();
    await wait([170, 120, 260][i], id);
  }
  highlight('3.6.0');
  await wait(260, id);
  await moveTo(...over(item('3.6.0')), id, 380, true);
  await wait(240, id);
  await click(id);
  choose('3.6.0');
  await wait(700, id);

  // AG 1.0.6: the same, its -bas build found up the list
  await toPart(2, 'mcu', id, 560);
  await wait(320, id);
  await click(id);
  part(2, 'mcu').classList.remove('hover');
  openPicker(part(2, 'mcu'));
  await wait(380, id);
  await moveTo(...over(item('3.5.12-bas')), id, 360, true);
  highlight('3.5.12-bas');
  await wait(300, id);
  scrollList(list.scrollTop - ITEM);
  await wait(420, id);
  await moveTo(...over(item('3.6.0')), id, 200, true);
  highlight('3.6.0');
  await wait(160, id);
  await moveTo(...over(item('3.6.0-bas')), id, 200, true);
  highlight('3.6.0-bas');
  await wait(300, id);
  await click(id);
  choose('3.6.0-bas');
  await wait(700, id);

  // and away, the two groups set, the camera back out; then they're cleared for the next
  hoverRow(-1);
  aim(null);
  await moveTo(...rest, id, 800);
  await wait(1600, id);
  rows.forEach(r => r.classList.remove('set'));
  await wait(300, id);
  carryOver();
  await wait(1000, id);
}

/* ---------- embedding ----------
   Same handshake as the other prototypes: once the fonts are in, the loop starts, and once it has
   caught up and that frame has painted, transitions come back and an embedding page is told this one
   is ready to show (and told again if it asks with "proto:ping", in case it only started listening
   after the page had loaded). */
const SCENE = 'manager';
const root = document.documentElement;
if (new URLSearchParams(location.search).has('embed')) root.classList.add('embed');
let shown = false;
const announce = () => { if (parent !== window) parent.postMessage({ type: 'proto:ready', scene: SCENE }, location.origin); };
addEventListener('message', e => { if (e.origin === location.origin && e.data === 'proto:ping' && shown) announce(); });
function markCaughtUp() {
  caughtUp = true;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.classList.remove('no-anim');
    shown = true;
    announce();
  }));
}
// A mouse moving over the page (only the lightbox's copy takes one) puts the scripted pointer out of
// sight until it leaves.
addEventListener('pointermove', e => { if (e.pointerType !== 'touch') root.classList.add('live'); }, { passive: true });
root.addEventListener('pointerleave', () => root.classList.remove('live'));
document.fonts.ready.then(loop);

/* ---------- framing ----------
   The stage scales to fit the frame. On the square phone card the frame is the whole card instead
   (update-manager-demo.tsx), and the page frames the narrower screen in it with a camera: by
   default from 72 stage px above and left of its top-left corner, so its top and side show and it
   reads as a screen before the camera moves in, cut at the right and the foot; aim() moves it in on
   a view (a box of stage px brought to fill the card) and aim(null) back out. Elsewhere it stays put. */
const BASE_VIEW = () => ({ x: -72, y: -72, w: 852, h: 852 });
let view = null;
const isSquare = () => innerWidth < (innerHeight * 7) / 6;
// The card the page is framed into (live-prototype.tsx), whose shape says which layout: 4:3 is
// .compact. The lightbox's copy is 16:9.
const card = frameElement?.closest('[data-live-prototype]');
function place() {
  const st = $('stage');
  const square = isSquare();
  root.classList.toggle('square', square);
  root.classList.toggle('compact', !square && !!card && card.clientWidth < card.clientHeight * 1.55);
  const W = st.offsetWidth, H = st.offsetHeight;
  const v = square ? view ?? BASE_VIEW() : null;
  const k = v ? Math.min(innerWidth / v.w, innerHeight / v.h) : Math.min(innerWidth / W, innerHeight / H);
  const [tx, ty] = v ? [-k * (v.x + v.w / 2 - W / 2), -k * (v.y + v.h / 2 - H / 2)] : [0, 0];
  st.style.transform = `translate(${tx}px, ${ty}px) scale(${k})`;
  return k;
}
const aim = v => { view = v; place(); };
// A resize lands at once rather than gliding there.
function fit() {
  const st = $('stage');
  st.style.transition = 'none'; place(); st.offsetHeight; st.style.transition = '';
}
addEventListener('resize', fit); fit();
addEventListener('keydown', e => {
  if (!root.classList.contains('embed')) return;
  // A click into the lightbox's live copy moves keyboard focus into this page, so hand the
  // lightbox's own keys back to it — but leave the arrows to a text field that's being edited.
  const typing = e.target.closest?.('input, textarea');
  if (e.key === 'Escape' || (!typing && (e.key === 'ArrowLeft' || e.key === 'ArrowRight'))) {
    e.preventDefault();
    parent.dispatchEvent(new KeyboardEvent('keydown', { key: e.key, code: e.code, bubbles: true, cancelable: true }));
  }
});
</script>
</body>
</html>
